<svg xmlns="http://www.w3.org/2000/svg" width="840" height="270" viewBox="0 0 840 270" role="img" aria-label="Tinnci GitHub Activity Bento">
  <defs>
    <style>
      .num { font: 900 34px 'Segoe UI', system-ui, -apple-system, sans-serif; fill: #111111; }
      .lbl { font: 800 11px 'Segoe UI', system-ui, -apple-system, sans-serif; fill: #111111; letter-spacing: 0.08em; }
      .sub { font: 700 10px 'Consolas', 'Courier New', monospace; fill: #111111; opacity: 0.8; }
      .hdr { font: 900 13px 'Consolas', 'Courier New', monospace; fill: #111111; letter-spacing: 0.06em; }
      .lang { font: 800 12px 'Consolas', 'Courier New', monospace; fill: #111111; }
